# agent-playbook: tier-2 command families ask before they run (core rule 2.3).
# A second layer under the BeforeTool hook, which lets a call through if it crashes or times out.
# Generated by tools/build.py from src/; do not edit. Priority 999 in the user tier (4.999) ranks
# above Gemini's "Always allow" choices (4.95), so those cannot skip these questions.

[[rule]]
toolName = "run_shell_command"
commandPrefix = ["gh pr create", "gh pr merge", "gh repo create", "gh repo delete", "git push --force", "git push -f", "git reset --hard", "git clean", "npm publish", "crontab", "gemini extensions install", "gemini extensions uninstall", "gemini extensions update", "gemini extensions enable", "gemini extensions disable", "gemini extensions link", "gemini extensions config"]
decision = "ask_user"
priority = 999

[[rule]]
mcpName = "github"
toolName = ["create_pull_request", "merge_pull_request"]
decision = "ask_user"
priority = 999
